[project]
name = "nexla-docqa-mcp"
version = "0.1.0"
description = "MCP server exposing grounded Q&A over financial annual-report PDFs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "pymupdf>=1.24.0",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "fastembed>=0.4.0",
    "openai>=1.40.0",
    "anthropic>=0.39.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
docqa-ingest = "docqa.ingest:main"
docqa-server = "docqa.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docqa"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
